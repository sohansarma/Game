apply plugin: 'com.android.application'

// ---- Tidepop build settings (pass with -P on the command line, or in ~/.gradle/gradle.properties) --------------
//   ADMOB_APP_ID        your AdMob *app* id, ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY   (required for release)
//   TIDEPOP_VERSION_CODE / TIDEPOP_VERSION_NAME                                         (raise the code for every upload)
//   signing (release only): keystore.properties in android/ with storeFile, storePassword, keyAlias, keyPassword,
//   or the env vars TIDEPOP_KEYSTORE, TIDEPOP_KEYSTORE_PASSWORD, TIDEPOP_KEY_ALIAS, TIDEPOP_KEY_PASSWORD
def SAMPLE_ADMOB_APP_ID = 'ca-app-pub-3940256099942544~3347511713' // Google's public sample app id: never pays
def admobAppId = project.findProperty('ADMOB_APP_ID') ?: SAMPLE_ADMOB_APP_ID
def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') || it.toLowerCase().contains('bundle') }
if (wantsRelease && admobAppId == SAMPLE_ADMOB_APP_ID) {
    throw new GradleException('A release build needs your own AdMob app id: -PADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY')
}
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))
def secret = { String prop, String env -> keystoreProps[prop] ?: System.getenv(env) }

android {
    namespace = "app.tidepop.arcade"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.tidepop.arcade"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (project.findProperty('TIDEPOP_VERSION_CODE') ?: '1').toInteger()
        versionName (project.findProperty('TIDEPOP_VERSION_NAME') ?: '1.0')
        manifestPlaceholders = [admobAppId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def file = secret('storeFile', 'TIDEPOP_KEYSTORE')
            if (file) {
                storeFile rootProject.file(file)
                storePassword secret('storePassword', 'TIDEPOP_KEYSTORE_PASSWORD')
                keyAlias secret('keyAlias', 'TIDEPOP_KEY_ALIAS')
                keyPassword secret('keyPassword', 'TIDEPOP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (secret('storeFile', 'TIDEPOP_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

# One-click deploy on Render (free web service). Note: the free plan has no
# persistent disk, so leaderboards AND player accounts/cloud saves reset when
# the service is redeployed or restarted. For real players add a disk (paid
# plan, mount it and set DATA_DIR to the mount path) or use Fly.io volumes.
services:
  - type: web
    name: tidepop
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: ./data
      # behind Render's proxy: read the client address from its headers
      # (per-IP rate limit, and 'Nearby tables' for phones on the same Wi-Fi)
      - key: TRUST_PROXY
        value: "1"

# Publishes the game (static files in /public) to GitHub Pages for free.
# Enable it in Settings → Pages → Source: "GitHub Actions".
# Without a leaderboard server the game runs fully with local best scores;
# set TIDEPOP_API in public/config.js to point at your server to enable
# online leaderboards.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # "Deploy from a branch" serves the repo root (index.html forwards to
      # public/), so this workflow only deploys when the source is "GitHub Actions".
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "build_type=$(gh api repos/${{ github.repository }}/pages --jq .build_type 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.build_type != 'workflow'
        run: echo "::notice::Pages source is '${{ steps.mode.outputs.build_type }}' – the branch build serves the game via the root index.html. Choose Source 'GitHub Actions' to deploy public/ directly."
      - id: pages
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4

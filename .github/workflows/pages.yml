# Publishes the game (static files in /public) to GitHub Pages for free.
# Enable it in Settings → Pages → Source: "GitHub Actions".
# Without a leaderboard server the game runs fully with local best scores;
# set TIDEPOP_API in public/config.js to point at your server to enable
# online leaderboards.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is not enabled yet. Enable it in Settings → Pages → Source 'GitHub Actions', then re-run this workflow."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tidepop</title>
  <meta name="description" content="Tidepop – a cozy arcade by the sea. A new shared puzzle every day, match-3, block puzzles, chess and ludo with friends. Free to play." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tidepop" />
  <meta property="og:title" content="Tidepop – today's Tide is waiting 🌊" />
  <meta property="og:description" content="One shared puzzle a day, cozy arcade games and play-with-friends. Can you flood today's Tide in par?" />
  <meta property="og:url" content="https://sohansarma.github.io/Game/" />
  <meta property="og:image" content="https://sohansarma.github.io/Game/icons/og.png" />
  <meta name="twitter:image" content="https://sohansarma.github.io/Game/icons/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#1565c0" />
  <meta name="theme-color" content="#1565c0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tidepop" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="config.js"></script>
</head>
<body>
  <div id="bg" aria-hidden="true"><div class="bubbles"></div></div>
  <main id="app">
    <section id="screen-loading" class="screen active">
      <div class="logo big">Tide<span>pop</span></div>
      <p class="muted">Loading the reef…</p>
    </section>
  </main>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sheet" tabindex="-1"></div>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#fff">Tidepop needs JavaScript enabled to play.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
